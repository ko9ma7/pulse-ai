name: Refresh RepoPulse radar data

on:
  schedule:
    # Every six hours. The non-zero minute avoids the busiest cron boundary.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh latest radar and cumulative archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run radar:update

      - name: Commit refreshed data
        shell: bash
        run: |
          if git diff --quiet -- \
            public/data/repositories.json docs/data/repositories.json \
            public/data/radar-history.json docs/data/radar-history.json; then
            echo "No radar data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/repositories.json docs/data/repositories.json \
            public/data/radar-history.json docs/data/radar-history.json
          git commit -m "data: refresh radar and cumulative history"
          git push
