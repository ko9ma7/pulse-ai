<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 — RepoPulse AI</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#0a0d0f;color:#f3f6f7}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.box{max-width:520px;text-align:center}b{display:block;color:#b8ff4f;font-size:72px;letter-spacing:-.08em}h1{font-size:24px;margin:4px 0 10px}p{color:#86939b;line-height:1.65}a,button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;margin:8px 4px;border-radius:9px;border:1px solid #2a3338;background:#11171b;color:#f3f6f7;text-decoration:none;cursor:pointer}a{background:#b8ff4f;color:#0a0d0f;border-color:#b8ff4f;font-weight:700}
  </style>
</head>
<body><main class="box"><b>404</b><h1>이 신호는 레이더에서 사라졌습니다.</h1><p>주소가 바뀌었거나 존재하지 않는 페이지입니다. 홈으로 돌아가 최신 Repository 신호를 확인하세요.</p><a id="home" href="./#/">홈으로 이동</a><button onclick="history.back()">이전 페이지</button></main><script>const p=location.pathname.split('/').filter(Boolean);const base=location.hostname.endsWith('github.io')&&p.length?'/'+p[0]+'/':'/';document.getElementById('home').href=base+'#/';</script></body></html>
